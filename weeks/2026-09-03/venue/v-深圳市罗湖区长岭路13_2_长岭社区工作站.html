<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长岭社区工作站 · 证据</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--tx:#1f2328;--sub:#6b7280;--red:#d92d20;--blue:#2563eb;--chip:#f3f4f6;--green:#087443}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
header .addr{color:var(--sub);font-size:13px}
header .stat{color:var(--sub);font-size:13px}
header a.back{margin-left:auto;color:var(--blue);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 12px}
header a.back:hover{background:var(--chip)}
main{padding:18px 22px 60px;max-width:1180px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;padding:14px 18px}
.sec>.st{font-weight:600;font-size:14px;margin:0 0 8px}
.sec>.st .n{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px}
.item{border-top:1px dashed var(--line);padding:10px 0 4px}
.item:first-of-type{border-top:0}
.item .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.item .pid{font-weight:600;font-size:14px}
.item .badge{background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.item .desc{color:#374151;font-size:13px}
.item .res{color:#b42318;font-size:12.5px;line-height:1.7;margin-top:6px;padding:6px 10px;background:#fff7f6;border-left:3px solid #f0a9a1;border-radius:0 4px 4px 0;word-break:break-word}
.item .res .reslb{display:inline-block;font-weight:600;color:#fff;background:#d9534f;border-radius:3px;padding:0 6px;margin-right:7px;font-size:11px;line-height:18px;vertical-align:1px}
.item .none{color:var(--sub);font-size:12px;padding:4px 0}
.vinfo{margin:-6px 0 12px;padding:8px 12px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#334155;font-weight:600}
.grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.grid figure{margin:0;width:300px}
.grid img{width:300px;height:225px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block;background:#eee}
.grid figcaption{font-size:12px;color:var(--sub);text-align:center;margin-top:3px}
/* 现场整体图片再大一档（350×263），与问题项照片（300×225）保持层级。
   注意：容器内宽 1098px（main max-width:1180 - 两侧 padding），3×360+2×10 = 1100 > 1098
   → 实测 360 宽会让整体图**每行只放 2 张**、右侧大片留白；350 则稳稳 3 张/行。 */
.grid.ovgrid figure{width:350px}
.grid.ovgrid img{width:350px;height:263px}
.tag{display:inline-block;background:var(--chip);color:var(--sub);border-radius:6px;padding:0 6px;font-size:11px;margin-left:6px}
#lb{position:fixed;inset:0;background:rgba(17,20,24,.92);display:none;z-index:100;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:88vh;border-radius:6px}
#lb .cap{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#e5e7eb;font-size:13px}
#lb .x{position:absolute;top:14px;right:20px;color:#fff;font-size:30px;cursor:pointer;line-height:1}
#lb .pv,#lb .nx{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:40px;cursor:pointer;padding:0 18px;user-select:none;opacity:.8}
#lb .pv{left:0}#lb .nx{right:0}
#lb .pv:hover,#lb .nx:hover{opacity:1}
footer{color:var(--sub);font-size:12px;padding:0 22px 30px;max-width:1180px}
</style></head><body>
<header>
  <h1>长岭社区工作站</h1>
  <span class="addr">深圳市罗湖区长岭路13-2</span>
  <span class="stat">现场整体图 2 · 问题项 1 · 问题照片 1</span>
  <a class="back" href="../index.html">&larr; 全部场所</a>
</header>
<main>
<div class="sec"><p class="st">现场整体图片<span class="n">2 张</span></p><div class="grid ovgrid">
<figure><img loading="lazy" src="../thumb/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/__overall__1.jpg" data-big="../img/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/__overall__1.jpg" alt="现场整体图片1" onclick="openLb(GAL.indexOf(this.dataset.big))"><figcaption>现场整体图片1</figcaption></figure>
<figure><img loading="lazy" src="../thumb/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/__overall__2.jpg" data-big="../img/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/__overall__2.jpg" alt="现场整体图片2" onclick="openLb(GAL.indexOf(this.dataset.big))"><figcaption>现场整体图片2</figcaption></figure>
</div></div>
<div class="vinfo">投放点数量：0 · 场所类型：机关事业单位办公场所</div>
<div class="sec"><p class="st">问题项证据<span class="n">1 项</span></p>
<div class="item">
  <div class="hd"><span class="pid">1.6</span><span class="badge">-3 分</span></div>
  <div class="desc">各类收集容器的分类标志完整、正确、清晰。 （12分）</div>
  <div class="res"><span class="reslb">检查结果</span>（2）收集容器标志缺失、错误或模糊不清的。（不强制要求垃圾桶套袋，若套袋的，收集容器应按垃圾类别对应颜色套袋）(-3)（1处问题）</div>
  <div class="grid">
<figure><img loading="lazy" src="../thumb/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/1.6_-3_1.jpg" data-big="../img/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/1.6_-3_1.jpg" alt="整改前" data-lb="1" onclick="openLb(GAL.indexOf(this.dataset.big))"><figcaption>整改前</figcaption></figure>
  </div>
</div>
</div>
</main>
<div id="lb"><span class="x" onclick="closeLb()">&times;</span><span class="pv" onclick="step(-1)">&#8249;</span><img alt=""><span class="cap"></span><span class="nx" onclick="step(1)">&#8250;</span></div>
<footer>数据源：深圳市生活垃圾分类巡查平台（2026-09-03 ~ 2026-09-09）</footer>
<script>GAL=["../img/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/__overall__1.jpg", "../img/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/__overall__2.jpg", "../img/%E6%B7%B1%E5%9C%B3%E5%B8%82%E7%BD%97%E6%B9%96%E5%8C%BA%E9%95%BF%E5%B2%AD%E8%B7%AF13-2_%E9%95%BF%E5%B2%AD%E7%A4%BE%E5%8C%BA%E5%B7%A5%E4%BD%9C%E7%AB%99/1.6_-3_1.jpg"];
var GAL=[],cur=0;
function openLb(i){cur=i;document.querySelector('#lb img').src=GAL[i];document.querySelector('#lb .cap').textContent=(i+1)+' / '+GAL.length;document.getElementById('lb').classList.add('on');}
function closeLb(){document.getElementById('lb').classList.remove('on');}
function step(d){cur=(cur+d+GAL.length)%GAL.length;openLb(cur);}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lb').classList.contains('on'))return;
  if(e.key==='Escape')closeLb();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);
});
</script>
</body></html>
