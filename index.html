<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>生活垃圾分类巡查 · 问题项证据册</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--tx:#1f2328;--sub:#6b7280;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
header .hint{color:var(--sub);font-size:12px}
.tabs{position:sticky;top:45px;z-index:15;display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;text-align:left;min-width:150px;line-height:1.3}
.tab .lab{display:block;font-weight:600;font-size:13px;color:var(--tx)}
.tab .sub{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.tab.on{background:#eff6ff;border-color:#bfdbfe}
.tab.on .lab{color:var(--blue)}
.gbtn{border:1px solid #93c5fd;background:#eff6ff;border-radius:10px;padding:6px 14px;cursor:pointer;text-align:left;min-width:165px;line-height:1.3;position:sticky;left:0;z-index:2;box-shadow:5px 0 8px rgba(255,255,255,.95)}
.gbtn .lab{display:block;font-weight:700;font-size:13px;color:var(--blue)}
.gbtn .sub{display:block;font-size:11px;color:#64748b;margin-top:2px}
.gbtn.on{background:#2563eb;border-color:#2563eb}.gbtn.on .lab,.gbtn.on .sub{color:#fff}
#global{display:none;background:#f8fafc;min-height:calc(100vh - 110px);padding:16px}
#global.on{display:block}#frame.off{display:none}
.gbar{position:sticky;top:109px;z-index:10;background:#f8fafc;padding:0 0 12px;display:flex;align-items:center;gap:8px}
.gbar input{flex:1;min-width:220px;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;font:inherit;background:#fff;color:var(--tx)}
.gbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}.gbar span{font-size:12px;color:var(--sub);white-space:nowrap}
#gresults{display:grid;gap:10px;max-width:1200px;margin:0 auto 24px}.gres{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.gres:hover{border-color:#93c5fd;background:#f8fbff}.gres h3{margin:0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.gres h3 b{color:var(--blue)}
.gres .meta{color:var(--sub);font-size:12px;margin-top:2px}.gres .match{font-size:12px;color:#475569;margin-top:7px;line-height:1.55;max-height:3.1em;overflow:hidden}.badge{font-size:11px;font-weight:500;color:#1d4ed8;background:#dbeafe;border-radius:999px;padding:1px 7px}
.gempty{padding:55px 12px;text-align:center;color:var(--sub);background:#fff;border:1px dashed #cbd5e1;border-radius:10px}
#frame{width:100%;height:calc(100vh - 110px);border:0;background:#fff;display:block}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
@media(max-width:720px){.gbar{flex-wrap:wrap}.gbar span{width:100%}.gbtn{position:static}.tabs{top:67px}#global{min-height:calc(100vh - 132px)}.gbar{top:132px}}
</style></head><body>
<header>
  <h1>生活垃圾分类巡查 · 问题项证据册</h1>
  <span class="hint">滚动覆盖：仅保留最近 10 周（超出自动清理最旧一周并回收仓库空间）</span>
</header>
<div class="tabs" id="tabs"><button class="gbtn" id="globalBtn" onclick="openGlobal()"><span class="lab">全局搜索</span><span class="sub">跨 8 个周期 · 0 家场所</span></button><button class="tab" data-w="2026-11-19" data-v="20261124175118" onclick="sel(this)"><span class="lab">2026-11-19 ~ 2026-11-25 周报</span><span class="sub">2026-11-19~2026-11-25 · 142 场所 · 1273 张</span></button><button class="tab" data-w="2026-11-05" data-v="20261123145932" onclick="sel(this)"><span class="lab">2026-11-05 ~ 2026-11-11 周报</span><span class="sub">2026-11-05~2026-11-11 · 210 场所 · 1855 张</span></button><button class="tab" data-w="2026-10-29" data-v="20261105163444" onclick="sel(this)"><span class="lab">2026-10-29 ~ 2026-11-04 周报</span><span class="sub">2026-10-29~2026-11-04 · 225 场所 · 2071 张</span></button><button class="tab" data-w="2026-10-22" data-v="20261029110112" onclick="sel(this)"><span class="lab">2026-10-22 ~ 2026-10-28 周报</span><span class="sub">2026-10-22~2026-10-28 · 190 场所 · 1484 张</span></button><button class="tab" data-w="2026-10-15" data-v="20261022164848" onclick="sel(this)"><span class="lab">2026-10-15 ~ 2026-10-21 周报</span><span class="sub">2026-10-15~2026-10-21 · 212 场所 · 1549 张</span></button><button class="tab" data-w="2026-10-09" data-v="20261015095402" onclick="sel(this)"><span class="lab">2026-10-09 ~ 2026-10-14 周报</span><span class="sub">2026-10-09~2026-10-14 · 39 场所 · 447 张</span></button><button class="tab" data-w="2026-09-29" data-v="20261009115223" onclick="sel(this)"><span class="lab">2026-09-29 ~ 2026-10-08 周报</span><span class="sub">2026-09-29~2026-10-08 · 41 场所 · 464 张</span></button><button class="tab" data-w="2026-09-17" data-v="20260923114901" onclick="sel(this)"><span class="lab">2026-09-17 ~ 2026-09-22 周报</span><span class="sub">2026-09-17~2026-09-22 · 36 场所 · 458 张</span></button></div><section id="global"><div class="gbar"><input id="gq" type="search" placeholder="搜索全部周期：场所、地址、类型、问题编号、问题描述、检查结果…" oninput="runGlobal()"><button onclick="clearGlobal()">清空</button><span id="gcount">输入关键词开始搜索</span></div><div id="gresults"></div></section><iframe id="frame" src="" loading="lazy"></iframe>
<script>
var TABS=["2026-11-19", "2026-11-05", "2026-10-29", "2026-10-22", "2026-10-15", "2026-10-09", "2026-09-29", "2026-09-17"], SEARCH=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().split(/\s+/).join(' ').trim();}
function showFrame(){document.getElementById('global').classList.remove('on');document.getElementById('frame').classList.remove('off');document.getElementById('globalBtn').classList.remove('on');}
function sel(btn, target){
  showFrame();
  var w=btn.dataset.w, v=btn.dataset.v||'0';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t===btn);});
  var frame=document.getElementById('frame'), src='weeks/'+w+'/index.html?v='+v+(target?'#'+target:'');
  frame.src=src; location.hash=w+(target?'/'+target:'');
}
function openGlobal(){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  document.getElementById('globalBtn').classList.add('on');
  document.getElementById('global').classList.add('on');document.getElementById('frame').classList.add('off');
  location.hash='search';setTimeout(function(){document.getElementById('gq').focus();},0);
}
function clearGlobal(){var q=document.getElementById('gq');q.value='';runGlobal();q.focus();}
function excerpt(row, terms){
  var text=(row.p||[]).join('；'); if(!text)return '该场所本期无问题项文字记录';
  var low=norm(text), pos=-1; terms.some(function(t){pos=low.indexOf(t);return pos>=0;});
  if(pos<0)pos=0; return (pos>32?'…':'')+text.slice(Math.max(0,pos-32),pos+150)+(pos+150<text.length?'…':'');
}
function runGlobal(){
  var raw=document.getElementById('gq').value, terms=norm(raw).split(' ').filter(Boolean), box=document.getElementById('gresults'), count=document.getElementById('gcount');
  if(!terms.length){count.textContent='输入关键词开始搜索';box.innerHTML='<div class="gempty">可跨周期搜索场所名称、地址、场所类型、问题编号、问题描述和检查结果。</div>';return;}
  var found=SEARCH.filter(function(r){var hay=norm([r.n,r.a,r.t,r.d,r.l,r.r,(r.p||[]).join(' ')].join(' '));return terms.every(function(t){return hay.indexOf(t)>=0;});});
  count.textContent='找到 '+found.length+' 家场所（跨 '+new Set(found.map(function(x){return x.w;})).size+' 个周期）';
  if(!found.length){box.innerHTML='<div class="gempty">没有找到匹配结果，请尝试更短的关键词。</div>';return;}
  box.innerHTML=found.slice(0,300).map(function(r){return '<article class="gres" data-w="'+esc(r.w)+'" data-v="'+esc(r.v)+'" data-k="'+esc(r.k)+'"><h3><b>'+esc(r.n||'未命名场所')+'</b><span class="badge">'+esc(r.r||r.w)+'</span></h3><div class="meta">'+esc([r.a,r.t,r.d].filter(Boolean).join(' · '))+'</div><div class="match">'+esc(excerpt(r,terms))+'</div></article>';}).join('')+(found.length>300?'<div class="gempty">结果超过 300 条，已显示前 300 条，请增加关键词缩小范围。</div>':'');
  box.querySelectorAll('.gres').forEach(function(el){el.addEventListener('click',function(){var tab=document.querySelector('.tab[data-w="'+el.dataset.w+'"]');if(tab)sel(tab,el.dataset.k);});});
}
function init(){
  if(!TABS.length)return;
  var want=(location.hash||'').slice(1); if(want==='search'){openGlobal();runGlobal();return;}
  var parts=want.split('/'), el=document.querySelector('.tab[data-w="'+parts[0]+'"]');
  if(!el)el=document.querySelector('.tab'); if(el)sel(el,parts[1]||'');
  document.getElementById('gresults').innerHTML='<div class="gempty">可跨周期搜索场所名称、地址、场所类型、问题编号、问题描述和检查结果。</div>';
}
init();
</script>
</body></html>
