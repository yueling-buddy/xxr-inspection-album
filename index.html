function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s||'').toLowerCase().split(/\s+/).join(' ').trim();}
function showFrame(){document.getElementById('global').classList.remove('on');document.getElementById('frame').classList.remove('off');document.getElementById('globalBtn').classList.remove('on');}
function sel(btn, target){
  showFrame();
  var w=btn.dataset.w, v=btn.dataset.v||'0';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t===btn);});
  var frame=document.getElementById('frame'), src='weeks/'+w+'/index.html?v='+v+(target?'#'+target:'');
  frame.src=src; location.hash=w+(target?'/'+target:'');
}
function openGlobal(){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  document.getElementById('globalBtn').classList.add('on');
  document.getElementById('global').classList.add('on');document.getElementById('frame').classList.add('off');
  location.hash='search';setTimeout(function(){document.getElementById('gq').focus();},0);
}
function clearGlobal(){var q=document.getElementById('gq');q.value='';runGlobal();q.focus();}
function excerpt(row, terms){
  var text=(row.p||[]).join('；'); if(!text)return '该场所本期无问题项文字记录';
  var low=norm(text), pos=-1; terms.some(function(t){pos=low.indexOf(t);return pos>=0;});
  if(pos<0)pos=0; return (pos>32?'…':'')+text.slice(Math.max(0,pos-32),pos+150)+(pos+150<text.length?'…':'');
}
function runGlobal(){
  var raw=document.getElementById('gq').value, terms=norm(raw).split(' ').filter(Boolean), box=document.getElementById('gresults'), count=document.getElementById('gcount');
  if(!terms.length){count.textContent='输入关键词开始搜索';box.innerHTML='<div class="gempty">可跨周期搜索场所名称、地址、场所类型、问题编号、问题描述和检查结果。</div>';return;}
  var found=SEARCH.filter(function(r){var hay=norm([r.n,r.a,r.t,r.d,r.l,r.r,(r.p||[]).join(' ')].join(' '));return terms.every(function(t){return hay.indexOf(t)>=0;});});
  count.textContent='找到 '+found.length+' 家场所（跨 '+new Set(found.map(function(x){return x.w;})).size+' 个周期）';
  if(!found.length){box.innerHTML='<div class="gempty">没有找到匹配结果，请尝试更短的关键词。</div>';return;}
  box.innerHTML=found.slice(0,300).map(function(r){return '<article class="gres" data-w="'+esc(r.w)+'" data-v="'+esc(r.v)+'" data-k="'+esc(r.k)+'"><h3><b>'+esc(r.n||'未命名场所')+'</b><span class="badge">'+esc(r.r||r.w)+'</span></h3><div class="meta">'+esc([r.a,r.t,r.d].filter(Boolean).join(' · '))+'</div><div class="match">'+esc(excerpt(r,terms))+'</div></article>';}).join('')+(found.length>300?'<div class="gempty">结果超过 300 条，已显示前 300 条，请增加关键词缩小范围。</div>':'');
  box.querySelectorAll('.gres').forEach(function(el){el.addEventListener('click',function(){var tab=document.querySelector('.tab[data-w="'+el.dataset.w+'"]');if(tab)sel(tab,el.dataset.k);});});
}
function init(){
  if(!TABS.length)return;
  var want=(location.hash||'').slice(1); if(want==='search'){openGlobal();runGlobal();return;}
  var parts=want.split('/'), el=document.querySelector('.tab[data-w="'+parts[0]+'"]');
  if(!el)el=document.querySelector('.tab'); if(el)sel(el,parts[1]||'');
  document.getElementById('gresults').innerHTML='<div class="gempty">可跨周期搜索场所名称、地址、场所类型、问题编号、问题描述和检查结果。</div>';
}
init();
</script>
</body></html>
