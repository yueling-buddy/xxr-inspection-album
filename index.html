<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>生活垃圾分类巡查 · 问题项证据册</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e5e7eb;--tx:#1f2328;--sub:#6b7280;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
header .hint{color:var(--sub);font-size:12px}
.tabs{position:sticky;top:45px;z-index:15;display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;text-align:left;min-width:150px;line-height:1.3}
.tab .lab{display:block;font-weight:600;font-size:13px;color:var(--tx)}
.tab .sub{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.tab.on{background:#eff6ff;border-color:#bfdbfe}
.tab.on .lab{color:var(--blue)}
#frame{width:100%;height:calc(100vh - 110px);border:0;background:#fff;display:block}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
</style></head><body>
<header>
  <h1>生活垃圾分类巡查 · 问题项证据册</h1>
  <span class="hint">滚动覆盖：仅保留最近 10 周（超出自动清理最旧一周并回收仓库空间）</span>
</header>
<div class="tabs" id="tabs"><button class="tab" data-w="2026-09-17" data-v="20260923104256" onclick="sel(this)"><span class="lab">2026-09-17 ~ 2026-09-23 周报</span><span class="sub">2026-09-17~2026-09-23 · 195 场所 · 1526 张</span></button><button class="tab" data-w="2026-09-10" data-v="20260917115128" onclick="sel(this)"><span class="lab">2026-09-10 ~ 09-16 周报</span><span class="sub">2026-09-10~2026-09-16 · 155 场所 · 1426 张</span></button><button class="tab" data-w="2026-09-03" data-v="20260914113944" onclick="sel(this)"><span class="lab">2026-09-03~09-09周报</span><span class="sub">2026-09-03~2026-09-09 · 169 场所 · 1479 张</span></button></div><iframe id="frame" src="" loading="lazy"></iframe>
<script>
var TABS=["2026-09-17", "2026-09-10", "2026-09-03"];
function sel(btn){
  var w=btn.dataset.w, v=btn.dataset.v||'0';
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t===btn);});
  document.getElementById('frame').src='weeks/'+w+'/index.html?v='+v;
  location.hash=w;
}
function init(){
  if(!TABS.length)return;
  var want=(location.hash||'').slice(1);
  var el=document.querySelector('.tab[data-w="'+want+'"]');
  if(!el)el=document.querySelector('.tab');
  if(el)sel(el);
}
init();
</script>
</body></html>
